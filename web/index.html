<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A compact minesweeper-style logic puzzle.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tiny Mines">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-20260702.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tiny Mines</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --games-nav-height: calc(48px + env(safe-area-inset-top)); }
    html, body { height: 100%; margin: 0; }
    body { padding-top: var(--games-nav-height); }
    flt-glass-pane {
      top: var(--games-nav-height) !important;
      height: calc(100% - var(--games-nav-height)) !important;
    }
    .games-nav-bar {
      position: fixed;
      z-index: 2147483647;
      inset: 0 0 auto;
      height: var(--games-nav-height);
      padding: env(safe-area-inset-top) 12px 0;
      display: flex;
      align-items: center;
      background: #10231b;
      box-sizing: border-box;
    }
    .games-home-link {
      padding: 8px 12px;
      border-radius: 999px;
      color: white;
      background: rgba(255, 255, 255, .1);
      font: 600 14px/1.2 system-ui, sans-serif;
      text-decoration: none;
    }
    .games-home-link:focus-visible { outline: 3px solid #c9f36a; outline-offset: 2px; }
  </style>
</head>
<body>
  <nav class="games-nav-bar" aria-label="게임 내비게이션">
    <a class="games-home-link" href="https://bon-on.github.io/" aria-label="게임 선택 화면으로 돌아가기">← 게임 목록</a>
  </nav>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((registration) => registration.unregister());
      });
    }
    if ('caches' in window) {
      caches.keys().then((keys) => {
        keys.forEach((key) => caches.delete(key));
      });
    }
  </script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load();
  </script>
</body>
</html>
